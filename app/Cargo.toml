[package]
name = "seda"
version = "0.1.0"
edition = "2024"
description = "Seda (صدا): clone your Persian voice and talk with Ollama models and Claude Code"

[dependencies]
gpui-kit = { version = "0.8.0", features = ["speech"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
hound = "3.5"
async-channel = "2"
dirs = "6"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
signal-hook = "0.3"

[patch.crates-io]
# gpui with an inherited layout direction (RTL) and RTL-aware wrapping; see vendor/PATCHES.md
gpui-pre = { path = "vendor/gpui-pre" }
# Input/Textarea alignment that follows the layout direction; see vendor/PATCHES.md
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
