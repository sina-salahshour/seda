[project]
name = "seda-sidecar"
version = "0.1.0"
description = "Seda ML sidecar: Persian TTS (OmniVoice, pocket-tts-farsi-v2), Whisper STT, LoRA training"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=5.3.0",
    "accelerate",
    "peft>=0.20.0",
    "omnivoice>=0.2.1",
    "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy",
    "soundfile",
    "librosa",
    "scipy",
    "num2words>=0.5.13",
    "huggingface_hub",
    "httpx",
    "sentencepiece",
    "pyyaml",
    "sphn",
]

[project.scripts]
seda-sidecar = "seda_sidecar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seda_sidecar"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
